name: uni-memory
services:
  app:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://uni_memory:${POSTGRES_PASSWORD:?请先运行初始化命令}@postgres:5432/uni_memory
      QDRANT_URL: http://qdrant:6333
      MODEL_CACHE: /models
      OAUTH_JWKS_PATH: /secrets/jwks.json
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - models:/models
      - ./.secrets:/secrets:ro
    tmpfs: [/tmp]
    read_only: true
    init: true
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      start_period: 30s
    logging:
      options: { max-size: 5m, max-file: "2" }
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: uni_memory
      POSTGRES_USER: uni_memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行初始化命令}
    volumes:
      - postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U uni_memory -d uni_memory"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      options: { max-size: 5m, max-file: "2" }
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?请先运行初始化命令}
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped
    logging:
      options: { max-size: 5m, max-file: "2" }
volumes:
  postgres:
  qdrant:
  models:
