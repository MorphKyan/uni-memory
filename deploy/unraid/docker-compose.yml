name: uni_memory
services:
  app:
    image: uni-memory:0.2.0
    pull_policy: never
    build:
      context: /mnt/cache/appdata/uni-memory
    env_file: /mnt/cache/appdata/uni-memory/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://uni_memory:${POSTGRES_PASSWORD:?请先初始化}@postgres:5432/uni_memory
      QDRANT_URL: http://qdrant:6333
      MODEL_CACHE: /models
      OAUTH_JWKS_PATH: /secrets/jwks.json
    ports:
      - "192.168.1.200:3100:3000"
    volumes:
      - /mnt/cache/appdata/uni-memory/models:/models
      - /mnt/cache/appdata/uni-memory/.secrets:/secrets:ro
    tmpfs: [/tmp]
    read_only: true
    init: true
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.webui: http://192.168.1.200:3100/readyz
      net.unraid.docker.shell: sh
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      start_period: 30s
    logging:
      options: { max-size: 5m, max-file: "2" }
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: uni_memory
      POSTGRES_USER: uni_memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化}
    volumes:
      - /mnt/cache/appdata/uni-memory/postgres:/var/lib/postgresql
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.shell: sh
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U uni_memory -d uni_memory"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      options: { max-size: 5m, max-file: "2" }
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?请先初始化}
    volumes:
      - /mnt/cache/appdata/uni-memory/qdrant:/qdrant/storage
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.shell: sh
    logging:
      options: { max-size: 5m, max-file: "2" }
